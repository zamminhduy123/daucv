name: Blog Post Generation

on:
  schedule:
    # 6:00 AM Asia/Ho_Chi_Minh = 23:00 UTC previous day
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of posts to generate (1-5)"
        type: number
        default: 1
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate blog posts
        id: generate
        working-directory: backend/scripts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          MIN=2
          MAX=4
          if [ -n "${{ github.event.inputs.count }}" ]; then
            MIN="${{ github.event.inputs.count }}"
            MAX="${{ github.event.inputs.count }}"
          fi

          echo "Generating $MIN-$MAX blog posts..."
          python publish_seo_blog_posts.py --min "$MIN" --max "$MAX" 2>&1 | tee publish.log
          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Script exited with code $EXIT_CODE. See publish.log for details."
            echo "GENERATED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_FILES=$(git -C "${{ github.workspace }}" status --porcelain -- '*.md' '*.markdown' 2>/dev/null | head -5)
          if [ -n "$NEW_FILES" ]; then
            echo "Generated files:"
            echo "$NEW_FILES"
            echo "GENERATED=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new blog files generated (may be already up-to-date or deduplicated)."
            echo "GENERATED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.generate.outputs.GENERATED == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/blog_posts/
          git diff --cached --quiet || git commit -m "chore: auto-generate blog posts [skip ci]"
          git push
