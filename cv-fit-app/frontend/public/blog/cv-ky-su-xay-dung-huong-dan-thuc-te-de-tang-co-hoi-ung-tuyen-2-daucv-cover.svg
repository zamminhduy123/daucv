<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV ky su xay dung</title>
  <desc id="desc">A branded DauCV-style construction engineer CV cover with blueprint grid, crane, hard hat, and resume card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf7"/>
      <stop offset="0.54" stop-color="#e6f5ec"/>
      <stop offset="1" stop-color="#f8f2dc"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#99b7a5" stroke-width="1" opacity="0.26"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17402d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <path d="M0 545 C185 485 300 625 485 560 C650 502 780 430 948 494 C1066 539 1130 570 1200 530 L1200 675 L0 675 Z" fill="#1f8a5b" opacity="0.12"/>
  <g transform="translate(90 70)">
    <rect width="132" height="46" rx="23" fill="#1f8a5b"/>
    <text x="28" y="31" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">DauCV</text>
  </g>
  <g transform="translate(105 190)">
    <text font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900" fill="#173f2c">CV kỹ sư</text>
    <text y="66" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900" fill="#173f2c">xây dựng</text>
    <text y="122" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#4c6658">Bản vẽ năng lực rõ ràng cho ATS và nhà tuyển dụng</text>
    <rect y="166" width="310" height="48" rx="24" fill="#f4b942"/>
    <text x="28" y="198" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#173f2c">Hồ sơ chắc nền móng</text>
  </g>
  <g transform="translate(690 98)" filter="url(#shadow)">
    <rect width="350" height="470" rx="34" fill="#ffffff"/>
    <rect x="38" y="48" width="150" height="18" rx="9" fill="#1f8a5b"/>
    <rect x="38" y="88" width="250" height="12" rx="6" fill="#d7e7dd"/>
    <rect x="38" y="115" width="215" height="12" rx="6" fill="#d7e7dd"/>
    <rect x="38" y="170" width="275" height="86" rx="18" fill="#eef7f1"/>
    <path d="M65 226 L117 189 L160 220 L212 181 L286 232" fill="none" stroke="#1f8a5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="300" width="275" height="12" rx="6" fill="#d7e7dd"/>
    <rect x="38" y="332" width="235" height="12" rx="6" fill="#d7e7dd"/>
    <rect x="38" y="364" width="258" height="12" rx="6" fill="#d7e7dd"/>
    <rect x="38" y="414" width="128" height="30" rx="15" fill="#f4b942"/>
  </g>
  <g transform="translate(575 116)" stroke="#24513b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 0 V405"/>
    <path d="M20 26 H260"/>
    <path d="M90 26 L20 92"/>
    <path d="M170 26 L20 162"/>
    <path d="M248 26 L20 235"/>
    <path d="M260 26 V125"/>
    <path d="M244 125 H288"/>
