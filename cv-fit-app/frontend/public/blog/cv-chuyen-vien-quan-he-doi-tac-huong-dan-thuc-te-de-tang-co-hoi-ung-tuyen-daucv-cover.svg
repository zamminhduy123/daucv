<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV chuyên viên quan hệ đối tác</title>
  <desc id="desc">Branded DauCV blog cover with partnership network and negotiation motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.5" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#FFF1F2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1060" cy="540" r="155" fill="#BBF7D0" opacity="0.52"/>
  <circle cx="150" cy="130" r="120" fill="#DBEAFE" opacity="0.75"/>
  <rect x="74" y="64" width="1052" height="548" rx="28" fill="#FFFFFF" opacity="0.94" filter="url(#shadow)"/>
  <rect x="112" y="104" width="204" height="54" rx="27" fill="#E8F5E9"/>
  <text x="139" y="139" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#167A55">DauCV</text>
  <text x="222" y="139" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E7D32">Blog</text>
  <text x="112" y="228" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="850" fill="#172554">CV quan hệ đối tác</text>
  <text x="112" y="286" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#047857">Kể rõ pipeline, đàm phán và giá trị hợp tác</text>
  <text x="112" y="348" font-family="Inter, Arial, sans-serif" font-size="25" fill="#475569">Tối ưu hồ sơ cho partnership, business development và alliance roles.</text>
  <g transform="translate(112 424)">
    <rect width="186" height="52" rx="26" fill="#ECFDF5"/>
    <text x="28" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#047857">Pipeline</text>
    <rect x="206" width="196" height="52" rx="26" fill="#F5F3FF"/>
    <text x="234" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#6D28D9">Partnership</text>
    <rect x="422" width="184" height="52" rx="26" fill="#EFF6FF"/>
    <text x="450" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1D4ED8">Win-win</text>
  </g>
  <g transform="translate(760 150)">
    <rect x="0" y="0" width="286" height="336" rx="30" fill="url(#card)"/>
    <circle cx="143" cy="86" r="42" fill="#FFFFFF" opacity="0.94"/>
    <circle cx="72" cy="206" r="34" fill="#D1FAE5" opacity="0.95"/>
    <circle cx="214" cy="206" r="34" fill="#DBEAFE" opacity="0.95"/>
    <circle cx="143" cy="272" r="34" fill="#FEF3C7" opacity="0.96"/>
    <path d="M126 120 L88 176 M160 120 L198 176 M101 220 L124 252 M185 220 L162 252" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
    <path d="M54 76 C92 24 196 24 232 76" fill="none" stroke="#FDE68A" stroke-width="9" stroke-linecap="round"/>
    <path d="M54 300 C92 350 196 350 232 300" fill="none" stroke="#A7F3D0" stroke-width="9" stroke-linecap="round"/>
    <text x="106" y="94" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#047857">CV</text>
