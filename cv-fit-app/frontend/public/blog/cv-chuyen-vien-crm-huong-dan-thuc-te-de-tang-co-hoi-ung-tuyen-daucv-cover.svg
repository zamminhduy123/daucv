<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV chuyên viên CRM</title>
  <desc id="desc">Branded DauCV cover with CRM pipeline cards and customer data motifs.</desc>
  <defs>
