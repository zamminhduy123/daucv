<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV chuyên viên quản trị rủi ro</title>
  <desc id="desc">Branded DauCV blog cover with risk matrix and control checklist motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.52" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111827" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 540 C210 468 332 650 520 560 C696 476 790 438 1200 520 V675 H0 Z" fill="#D1FAE5" opacity="0.7"/>
  <rect x="72" y="62" width="1056" height="552" rx="28" fill="#FFFFFF" opacity="0.94" filter="url(#shadow)"/>
  <rect x="110" y="104" width="204" height="54" rx="27" fill="#E8F5E9"/>
  <text x="137" y="139" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#167A55">DauCV</text>
  <text x="220" y="139" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E7D32">Blog</text>
  <text x="110" y="228" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="850" fill="#172554">CV quản trị rủi ro</text>
  <text x="110" y="286" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#B45309">Thể hiện tư duy kiểm soát, tuân thủ và ra quyết định</text>
  <text x="110" y="348" font-family="Inter, Arial, sans-serif" font-size="25" fill="#475569">Viết kinh nghiệm theo rủi ro, tác động kinh doanh và chỉ số đo lường.</text>
  <g transform="translate(110 424)">
    <rect width="176" height="52" rx="26" fill="#FEF3C7"/>
    <text x="28" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#92400E">Risk map</text>
    <rect x="196" width="202" height="52" rx="26" fill="#ECFDF5"/>
    <text x="224" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#047857">Controls</text>
    <rect x="418" width="172" height="52" rx="26" fill="#EFF6FF"/>
    <text x="446" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1D4ED8">Audit trail</text>
  </g>
  <g transform="translate(748 142)">
    <rect width="318" height="344" rx="28" fill="#0F172A"/>
    <text x="34" y="58" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Risk Matrix</text>
    <g transform="translate(34 88)">
      <rect width="74" height="74" rx="14" fill="#BBF7D0"/>
      <rect x="86" width="74" height="74" rx="14" fill="#FDE68A"/>
      <rect x="172" width="74" height="74" rx="14" fill="#FDBA74"/>
      <rect y="86" width="74" height="74" rx="14" fill="#DCFCE7"/>
      <rect x="86" y="86" width="74" height="74" rx="14" fill="#FEF3C7"/>
      <rect x="172" y="86" width="74" height="74" rx="14" fill="#FCA5A5"/>
      <rect y="172" width="74" height="74" rx="14" fill="#A7F3D0"/>
      <rect x="86" y="172" width="74" height="74" rx="14" fill="#FCD34D"/>
      <rect x="172" y="172" width="74" height="74" rx="14" fill="#EF4444"/>
    </g>
    <path d="M255 95 L282 122 L255 149" fill="none" stroke="#93C5FD" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 292 h188" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
    <path d="M44 318 h132" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
  </g>
