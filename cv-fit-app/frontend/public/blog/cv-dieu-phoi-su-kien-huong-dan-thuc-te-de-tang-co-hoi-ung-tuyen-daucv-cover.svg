<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV điều phối sự kiện</title>
  <desc id="desc">Branded DauCV cover with event planning timeline, venue blocks, and checklist motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8EA"/>
      <stop offset="0.48" stop-color="#E8F5E9"/>
      <stop offset="1" stop-color="#F0ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#174A2C" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="72" y="68" width="1056" height="539" rx="34" fill="#FFFFFF" opacity="0.94" filter="url(#shadow)"/>
  <text x="116" y="129" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#1E7D42">DauCV</text>
  <text x="116" y="174" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#4B6355">SEO BLOG GUIDE</text>
  <text x="116" y="252" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900" fill="#102A1B">CV điều phối sự kiện</text>
  <text x="119" y="300" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#2F6F47">Timeline, vendor, ngân sách và trải nghiệm khách mời</text>
  <rect x="118" y="356" width="386" height="92" rx="24" fill="#E8F5E9" stroke="#8BD0A0" stroke-width="2"/>
  <text x="148" y="394" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#1B5E34">Show proof, not tasks</text>
  <text x="148" y="426" font-family="Inter, Arial, sans-serif" font-size="20" fill="#34513E">Số khách, ngân sách, vendor, rủi ro</text>
  <rect x="118" y="470" width="312" height="42" rx="21" fill="#1E7D42"/>
  <text x="148" y="498" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Hồ sơ gọn và có kết quả</text>
  <rect x="634" y="142" width="402" height="388" rx="30" fill="#F9FBFA" stroke="#D7E8DD" stroke-width="2"/>
  <line x1="704" y1="220" x2="704" y2="460" stroke="#1E7D42" stroke-width="9" stroke-linecap="round"/>
  <circle cx="704" cy="220" r="21" fill="#1E7D42"/>
  <circle cx="704" cy="340" r="21" fill="#7B65D8"/>
  <circle cx="704" cy="460" r="21" fill="#B89422"/>
  <rect x="748" y="190" width="230" height="60" rx="16" fill="#E8F5E9"/>
  <rect x="748" y="310" width="230" height="60" rx="16" fill="#F0ECFF"/>
  <rect x="748" y="430" width="230" height="60" rx="16" fill="#F6F1D8"/>
  <text x="778" y="228" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#163721">Pre-event plan</text>
  <text x="778" y="348" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#163721">Vendor control</text>
  <text x="778" y="468" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#163721">Post-event report</text>
