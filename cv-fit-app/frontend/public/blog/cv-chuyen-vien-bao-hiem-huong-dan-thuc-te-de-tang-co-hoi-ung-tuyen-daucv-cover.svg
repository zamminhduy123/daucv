<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV chuyên viên bảo hiểm</title>
  <desc id="desc">Branded green and blue DauCV blog cover with insurance policy and shield visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7ef"/>
      <stop offset="0.55" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#f7fbf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2fbf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f5132" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 530 C190 470 305 620 510 555 C742 482 860 432 1200 505 L1200 675 L0 675 Z" fill="#c7f0d8"/>
  <circle cx="1015" cy="132" r="104" fill="#b8e7ff" opacity="0.65"/>
  <circle cx="1086" cy="214" r="38" fill="#32b36b" opacity="0.18"/>
  <g transform="translate(760 128)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="390" rx="28" fill="url(#card)"/>
    <rect x="34" y="48" width="165" height="20" rx="10" fill="#1f8f53"/>
    <rect x="34" y="92" width="230" height="12" rx="6" fill="#a8d9be"/>
    <rect x="34" y="122" width="188" height="12" rx="6" fill="#c4e8d2"/>
    <rect x="34" y="180" width="230" height="104" rx="18" fill="#e8f7ef"/>
    <path d="M150 197 L220 225 L209 282 C201 322 177 348 150 360 C123 348 99 322 91 282 L80 225 Z" fill="#32b36b"/>
    <path d="M122 272 L143 293 L184 243" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="324" width="190" height="12" rx="6" fill="#9fd9ba"/>
  </g>
  <g transform="translate(104 86)">
    <rect x="0" y="0" width="148" height="46" rx="23" fill="#ffffff" opacity="0.9"/>
    <circle cx="28" cy="23" r="13" fill="#32b36b"/>
    <text x="52" y="30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#195b38">DauCV</text>
  </g>
  <text x="104" y="210" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#1f8f53">SEO BLOG</text>
  <text x="104" y="286" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#123c2b">CV chuyên viên</text>
  <text x="104" y="354" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#123c2b">bảo hiểm</text>
  <text x="104" y="418" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#355949">Làm rõ tư vấn, chăm sóc khách hàng và chỉ tiêu hợp đồng</text>
  <g transform="translate(104 474)">
    <rect x="0" y="0" width="186" height="42" rx="21" fill="#ffffff"/>
    <text x="22" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#1f8f53">ATS-ready CV</text>
  </g>
