<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV quan ly du an</title>
  <desc id="desc">A branded DauCV-style project manager CV cover with roadmap milestones, kanban board, and resume card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf7"/>
      <stop offset="0.5" stop-color="#e8f4eb"/>
      <stop offset="1" stop-color="#fff0dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#173f2c" flood-opacity="0.17"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M68 520 C220 430 330 560 470 460 C610 360 730 440 852 330 C960 232 1068 260 1150 170" fill="none" stroke="#1f8a5b" stroke-width="8" stroke-linecap="round" opacity="0.22"/>
  <g fill="#f4b942" stroke="#173f2c" stroke-width="6">
    <circle cx="78" cy="515" r="18"/>
    <circle cx="470" cy="460" r="18"/>
    <circle cx="852" cy="330" r="18"/>
    <circle cx="1150" cy="170" r="18"/>
  </g>
  <g transform="translate(88 70)">
    <rect width="132" height="46" rx="23" fill="#1f8a5b"/>
    <text x="28" y="31" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">DauCV</text>
  </g>
  <g transform="translate(105 190)">
    <text font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#173f2c">CV quản lý</text>
    <text y="64" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#173f2c">dự án</text>
    <text y="120" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#4f6859">Biến deadline, ngân sách và phối hợp thành bằng chứng</text>
    <rect y="164" width="324" height="48" rx="24" fill="#f4b942"/>
    <text x="28" y="196" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#173f2c">Hồ sơ có lộ trình rõ</text>
  </g>
  <g transform="translate(675 90)" filter="url(#shadow)">
    <rect width="360" height="455" rx="34" fill="#ffffff"/>
    <rect x="42" y="44" width="154" height="18" rx="9" fill="#1f8a5b"/>
    <rect x="42" y="84" width="248" height="12" rx="6" fill="#d9e8dd"/>
    <rect x="42" y="112" width="220" height="12" rx="6" fill="#d9e8dd"/>
    <rect x="42" y="164" width="78" height="138" rx="16" fill="#eef7f0"/>
    <rect x="142" y="164" width="78" height="138" rx="16" fill="#fef4d7"/>
    <rect x="242" y="164" width="78" height="138" rx="16" fill="#e7f2ee"/>
    <rect x="58" y="190" width="46" height="12" rx="6" fill="#1f8a5b"/>
    <rect x="158" y="220" width="46" height="12" rx="6" fill="#d59a21"/>
    <rect x="258" y="204" width="46" height="12" rx="6" fill="#1f8a5b"/>
    <rect x="42" y="340" width="272" height="12" rx="6" fill="#d9e8dd"/>
    <rect x="42" y="372" width="232" height="12" rx="6" fill="#d9e8dd"/>
    <rect x="42" y="410" width="130" height="30" rx="15" fill="#f4b942"/>
  </g>
  <g transform="translate(565 398)">
    <rect width="86" height="62" rx="14" fill="#ffffff" stroke="#1f8a5b" stroke-width="6"/>
    <path d="M22 32 L38 47 L66 18" fill="none" stroke="#1f8a5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="-28" width="86" height="62" rx="14" fill="#ffffff" stroke="#f4b942" stroke-width="6"/>
    <path d="M134 3 H176 M134 22 H164" stroke="#d59a21" stroke-width="8" stroke-linecap="round"/>
  </g>
