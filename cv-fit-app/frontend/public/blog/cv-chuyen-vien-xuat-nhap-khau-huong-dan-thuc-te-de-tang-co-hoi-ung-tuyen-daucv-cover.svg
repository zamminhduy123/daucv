<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV chuyen vien xuat nhap khau</title>
  <desc id="desc">A branded DauCV-style import export CV cover with container stacks, route lines, and a resume card.</desc>
  <defs>
