      <stop offset="0" stop-color="#f6fbf8"/>
      <stop offset="0.52" stop-color="#e3f3f0"/>
      <stop offset="1" stop-color="#fff2d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#164238" flood-opacity="0.16"/>
