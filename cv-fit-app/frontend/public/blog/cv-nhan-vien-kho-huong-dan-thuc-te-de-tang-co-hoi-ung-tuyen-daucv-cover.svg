    <rect x="82" y="26" width="136" height="126" rx="14" fill="#d99b3d"/>
    <path d="M82 65 H218" stroke="#b57c2d" stroke-width="10"/>
    <path d="M0 198 H136 M164 198 H300" stroke="#c88d35" stroke-width="10"/>
    <rect x="-44" y="318" width="394" height="72" rx="24" fill="#ffffff"/>
    <rect x="-12" y="343" width="118" height="16" rx="8" fill="#32b36b"/>
    <rect x="130" y="343" width="172" height="16" rx="8" fill="#b7dfc5"/>
