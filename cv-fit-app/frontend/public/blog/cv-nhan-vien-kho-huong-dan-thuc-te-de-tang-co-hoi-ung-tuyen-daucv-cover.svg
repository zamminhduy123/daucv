  <text x="100" y="210" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#1f8f53">SEO BLOG</text>
  <text x="100" y="286" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#123c2b">CV nhân viên</text>
  <text x="100" y="354" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900" fill="#123c2b">kho</text>
  <text x="100" y="418" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600" fill="#5a4a2f">Nêu rõ kiểm kê, nhập xuất hàng và độ chính xác vận hành</text>
