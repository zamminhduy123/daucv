<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DauCV cover for CV nhân viên kho</title>
  <desc id="desc">Branded DauCV blog cover with warehouse inventory boxes and checklist visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1fbf5"/>
      <stop offset="0.58" stop-color="#fff6e0"/>
      <stop offset="1" stop-color="#e5f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#734a13" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 520 C168 558 280 474 438 512 C621 557 785 636 1200 538 L1200 675 L0 675 Z" fill="#d7f2df"/>
  <g transform="translate(730 150)" filter="url(#shadow)">
