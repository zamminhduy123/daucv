# Pre-commit hooks — run with:
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files          # run manually
#   pre-commit run --files app/x.py     # run on specific files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
